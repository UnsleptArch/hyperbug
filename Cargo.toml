[package]
name = "hyperbug"
version = "0.1.0"
edition = "2024"

[dependencies]
io-uring = "0.7.15"
kvm-bindings = "0.14.1"
kvm-ioctls = "0.25.0"
libc = "0.2"
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
vmm-sys-util = "0.15"
seccompiler = "0.5"
libloading = "0.8"
wasmtime = { version = "27", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
proptest = "1.5"
